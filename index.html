<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kashif Tech Solutions | Custom PCs & Corporate IT Solutions</title>

  <meta
    name="description"
    content="Kashif Tech Solutions provides custom gaming PCs, computer components, workstations, PC upgrades and corporate bulk computer solutions."
  />

  <meta name="theme-color" content="#05070b" />

  <style>
    /* =========================================================
       KASHIF TECH SOLUTIONS
       Single-file static website
       ========================================================= */

    :root {
      --bg: #05070b;
      --bg2: #080c13;
      --card: rgba(14, 19, 29, 0.82);
      --card2: #0d131e;
      --text: #f5f7fb;
      --muted: #9ba7b8;
      --line: rgba(255, 255, 255, 0.09);

      --blue: #35a7ff;
      --cyan: #19e6ff;
      --purple: #8b5cf6;
      --green: #22c55e;

      --max: 1180px;
      --radius: 22px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(25, 230, 255, 0.08), transparent 28%),
        radial-gradient(circle at 90% 15%, rgba(139, 92, 246, 0.10), transparent 28%),
        linear-gradient(180deg, #05070b 0%, #070a10 50%, #05070b 100%);

      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(var(--max), calc(100% - 40px));
      margin: auto;
    }

    /* Background grid */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;

      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);

      background-size: 55px 55px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    /* ================= HEADER ================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;

      background: rgba(5, 7, 11, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;

      display: grid;
      place-items: center;

      background:
        linear-gradient(135deg, var(--cyan), var(--blue) 45%, var(--purple));

      color: #02050a;
      font-size: 18px;

      box-shadow:
        0 0 25px rgba(25, 230, 255, 0.22);
    }

    .logo-text span {
      color: var(--cyan);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    nav a {
      color: #cbd3df;
      font-size: 14px;
      font-weight: 600;
      transition: 0.25s;
    }

    nav a:hover {
      color: white;
    }

    .nav-button {
      padding: 11px 17px;
      border: 1px solid rgba(53,167,255,0.35);
      border-radius: 12px;

      background: rgba(53,167,255,0.08);
      color: white;

      transition: 0.25s;
    }

    .nav-button:hover {
      background: var(--blue);
      color: #03101a;
      border-color: var(--blue);
    }

    .menu {
      display: none;
      width: 42px;
      height: 42px;

      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);

      color: white;
      cursor: pointer;
      font-size: 20px;
    }

    /* ================= HERO ================= */

    .hero {
      min-height: 820px;
      padding-top: 150px;
      padding-bottom: 100px;

      display: flex;
      align-items: center;
      position: relative;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 70px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 8px 13px;
      border: 1px solid rgba(25,230,255,0.17);
      border-radius: 999px;

      background: rgba(25,230,255,0.055);
      color: #8eefff;

      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--cyan);
    }

    h1 {
      margin-top: 23px;

      font-size: clamp(48px, 6.5vw, 86px);
      line-height: 0.96;
      letter-spacing: -4px;
      font-weight: 950;
    }

    h1 .gradient {
      display: block;

      background:
        linear-gradient(
          100deg,
          #fff 0%,
          #b7f6ff 30%,
          #35a7ff 65%,
          #a78bfa 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-text {
      max-width: 640px;
      margin-top: 25px;

      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
      margin-top: 34px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      min-height: 50px;
      padding: 0 20px;

      border-radius: 13px;
      font-weight: 800;
      font-size: 14px;

      transition:
        transform 0.25s,
        box-shadow 0.25s,
        background 0.25s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      color: #031018;

      background:
        linear-gradient(135deg, #74ecff, #35a7ff);

      box-shadow:
        0 10px 35px rgba(53,167,255,0.22);
    }

    .btn-primary:hover {
      box-shadow:
        0 14px 45px rgba(53,167,255,0.34);
    }

    .btn-secondary {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.035);
      color: white;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.08);
    }

    .hero-trust {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      margin-top: 45px;
      color: #8390a2;
      font-size: 13px;
    }

    .hero-trust strong {
      color: #e8edf5;
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
    }

    /* ================= PC VISUAL ================= */

    .pc-scene {
      position: relative;
      height: 510px;

      display: grid;
      place-items: center;
    }

    .glow {
      position: absolute;
      width: 380px;
      height: 380px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(25,230,255,0.20),
          rgba(139,92,246,0.08) 42%,
          transparent 70%
        );

      filter: blur(10px);
    }

    .pc {
      width: 300px;
      height: 410px;

      position: relative;
      z-index: 2;

      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 25px;

      background:
        linear-gradient(
          135deg,
          #151c28,
          #070a10 48%,
          #111827
        );

      box-shadow:
        0 40px 80px rgba(0,0,0,0.55),
        0 0 60px rgba(25,230,255,0.12);

      transform: perspective(900px) rotateY(-9deg) rotateX(3deg);
    }

    .pc::before {
      content: "";
      position: absolute;
      left: 18px;
      top: 18px;
      right: 18px;
      bottom: 18px;

      border-radius: 17px;

      border: 1px solid rgba(255,255,255,0.08);
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.035),
          rgba(0,0,0,0.22)
        );
    }

    .glass {
      position: absolute;
      left: 31px;
      right: 31px;
      top: 32px;
      height: 285px;

      border-radius: 13px;

      background:
        linear-gradient(
          125deg,
          rgba(53,167,255,0.06),
          rgba(139,92,246,0.10)
        );

      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .glass::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          120deg,
          transparent 25%,
          rgba(255,255,255,0.07) 50%,
          transparent 75%
        );

      transform: translateX(-100%);
      animation: shine 4s infinite;
    }

    @keyframes shine {
      60%, 100% {
        transform: translateX(100%);
      }
    }

    .fan {
      position: absolute;
      width: 73px;
      height: 73px;

      border-radius: 50%;

      border: 3px solid rgba(53,167,255,0.35);

      background:
        radial-gradient(
          circle,
          #19e6ff 0 7px,
          #17304a 8px 14px,
          transparent 15px
        );

      box-shadow:
        0 0 25px rgba(25,230,255,0.35),
        inset 0 0 25px rgba(25,230,255,0.15);
    }

    .fan:nth-child(1) {
      top: 22px;
      left: 24px;
    }

    .fan:nth-child(2) {
      top: 106px;
      left: 24px;
    }

    .fan:nth-child(3) {
      top: 190px;
      left: 24px;
    }

    .gpu {
      position: absolute;
      right: 20px;
      top: 93px;

      width: 135px;
      height: 62px;

      border-radius: 8px;
      border: 1px solid rgba(139,92,246,0.45);

      background:
        linear-gradient(
          135deg,
          #262033,
          #100e18
        );

      box-shadow: 0 0 30px rgba(139,92,246,0.16);
    }

    .gpu::after {
      content: "KTS";
      position: absolute;
      right: 10px;
      top: 22px;

      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #bba5ff;
    }

    .led {
      position: absolute;
      left: 35px;
      right: 35px;
      bottom: 47px;

      height: 4px;
      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          var(--blue),
          var(--purple)
        );

      box-shadow:
        0 0 18px var(--blue);
    }

    .pc-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 20px;

      text-align: center;

      color: #667286;
      font-size: 9px;
      letter-spacing: 4px;
      font-weight: 900;
    }

    .floating-card {
      position: absolute;
      z-index: 5;

      padding: 15px 17px;

      border: 1px solid var(--line);
      border-radius: 16px;

      background: rgba(9,13,20,0.84);
      backdrop-filter: blur(12px);

      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .floating-card.one {
      top: 55px;
      right: 5px;
    }

    .floating-card.two {
      bottom: 65px;
      left: 0;
    }

    .floating-card strong {
      display: block;
      font-size: 15px;
      margin-bottom: 3px;
    }

    .floating-card small {
      color: var(--muted);
    }

    /* ================= SECTIONS ================= */

    section {
      padding: 100px 0;
    }

    .section-head {
      max-width: 700px;
      margin-bottom: 45px;
    }

    .section-kicker {
      color: var(--cyan);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h2 {
      font-size: clamp(34px, 4vw, 55px);
      line-height: 1.05;
      letter-spacing: -2px;
    }

    .section-head p {
      margin-top: 15px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 16px;
    }

    /* ================= SERVICES ================= */

    .services {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 17px;
    }

    .service {
      position: relative;
      overflow: hidden;

      padding: 28px;
      min-height: 220px;

      border: 1px solid var(--line);
      border-radius: var(--radius);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.045),
          rgba(255,255,255,0.015)
        );

      transition:
        transform 0.3s,
        border-color 0.3s,
        background 0.3s;
    }

    .service:hover {
      transform: translateY(-6px);
      border-color: rgba(53,167,255,0.32);

      background:
        linear-gradient(
          145deg,
          rgba(53,167,255,0.08),
          rgba(139,92,246,0.035)
        );
    }

    .service-icon {
      width: 52px;
      height: 52px;

      display: grid;
      place-items: center;

      border-radius: 15px;

      background: rgba(53,167,255,0.09);
      border: 1px solid rgba(53,167,255,0.15);

      font-size: 24px;
      margin-bottom: 23px;
    }

    .service h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .service p {
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    /* ================= PORTFOLIO ================= */

    .portfolio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .build {
      min-height: 330px;
      position: relative;
      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: var(--radius);

      background: #0a0e15;
    }

    .build-visual {
      height: 220px;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(53,167,255,0.25),
          transparent 40%
        ),
        linear-gradient(
          135deg,
          #101927,
          #07090e
        );
    }

    .build-visual::before {
      content: "";
      position: absolute;

      width: 170px;
      height: 170px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border-radius: 25px;

      border: 2px solid rgba(53,167,255,0.28);

      box-shadow:
        0 0 50px rgba(53,167,255,0.18),
        inset 0 0 30px rgba(53,167,255,0.08);
    }

    .build-visual.purple {
      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(139,92,246,0.28),
          transparent 42%
        ),
        linear-gradient(135deg,#161124,#07090e);
    }

    .build-visual.purple::before {
      border-color: rgba(139,92,246,0.3);
      box-shadow: 0 0 50px rgba(139,92,246,0.2);
    }

    .build-visual.cyan {
      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(25,230,255,0.25),
          transparent 42%
        ),
        linear-gradient(135deg,#07161b,#07090e);
    }

    .build-visual .mini-pc {
      position: absolute;

      width: 125px;
      height: 155px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.13);

      background: linear-gradient(145deg,#1a2230,#080b11);

      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .mini-pc::after {
      content: "";
      position: absolute;

      left: 14px;
      right: 14px;
      bottom: 16px;

      height: 3px;
      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          var(--blue),
          var(--purple)
        );

      box-shadow: 0 0 15px var(--blue);
    }

    .build-info {
      padding: 20px;
    }

    .build-info h3 {
      font-size: 19px;
      margin-bottom: 7px;
    }

    .build-info p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* ================= CORPORATE ================= */

    .corporate {
      position: relative;
      overflow: hidden;

      padding: 60px;

      border-radius: 30px;
      border: 1px solid rgba(53,167,255,0.18);

      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(139,92,246,0.17),
          transparent 35%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(25,230,255,0.12),
          transparent 35%
        ),
        #0a1019;
    }

    .corporate-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 60px;
      align-items: center;
    }

    .corporate h2 {
      max-width: 650px;
    }

    .corporate p {
      color: var(--muted);
      line-height: 1.75;
      margin-top: 18px;
      max-width: 650px;
    }

    .corporate-list {
      display: grid;
      gap: 12px;
      margin-top: 25px;
    }

    .corporate-list div {
      display: flex;
      gap: 12px;
      align-items: center;

      color: #dce4ef;
      font-size: 14px;
    }

    .check {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      color: #04120a;
      background: var(--green);

      font-size: 13px;
      font-weight: 900;
    }

    .corporate-card {
      padding: 30px;

      border: 1px solid var(--line);
      border-radius: 22px;

      background: rgba(0,0,0,0.18);
    }

    .corporate-card .big-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .corporate-card h3 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .corporate-card p {
      margin: 0;
      font-size: 14px;
    }

    /* ================= ABOUT ================= */

    .about-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 65px;
      align-items: center;
    }

    .about-box {
      min-height: 350px;

      border-radius: 28px;
      border: 1px solid var(--line);

      display: grid;
      place-items: center;

      background:
        radial-gradient(
          circle at center,
          rgba(53,167,255,0.14),
          transparent 55%
        ),
        #080c13;
    }

    .about-logo {
      text-align: center;
    }

    .about-logo-mark {
      width: 100px;
      height: 100px;

      margin: auto auto 20px;

      display: grid;
      place-items: center;

      border-radius: 28px;

      font-size: 38px;
      font-weight: 950;

      color: #031018;

      background:
        linear-gradient(
          135deg,
          var(--cyan),
          var(--blue),
          var(--purple)
        );

      box-shadow:
        0 0 60px rgba(53,167,255,0.2);
    }

    .about-logo strong {
      font-size: 20px;
      letter-spacing: 1px;
    }

    .about-copy p {
      color: var(--muted);
      line-height: 1.8;
      margin-top: 17px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 30px;
    }

    .stat {
      padding: 20px;

      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.025);
    }

    .stat strong {
      display: block;
      font-size: 25px;
      color: white;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    /* ================= CONTACT ================= */

    .contact {
      padding-bottom: 120px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .contact-card {
      padding: 30px;

      border-radius: var(--radius);
      border: 1px solid var(--line);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.04),
          rgba(255,255,255,0.015)
        );
    }

    .contact-card h3 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .contact-card p {
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 20px;
    }

    .representative {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;

      padding: 17px 0;

      border-top: 1px solid var(--line);
    }

    .representative:first-of-type {
      border-top: 0;
    }

    .rep-name {
      font-weight: 800;
    }

    .rep-role {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .phone {
      color

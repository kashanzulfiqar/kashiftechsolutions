<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashif Tech Solutions | Custom Gaming PCs & Components</title>
    <!-- Google Fonts for Elite Gaming Aesthetic -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #08090c;
            --card-bg: #12151c;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff007f;
            --accent-orange: #ffaa00;
            --text-main: #ffffff;
            --text-muted: #a3a8b4;
            --neon-glow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #08090c; }
        ::-webkit-scrollbar-thumb { background: #1f2430; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

        /* Header Navigation */
        header {
            background: rgba(18, 21, 28, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--accent-cyan);
            padding: 15px 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .fb-link-btn {
            background: linear-gradient(45deg, #1877f2, #00f0ff);
            color: white;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 5px;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fb-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }

        /* Hero Section */
        .hero {
            padding: 180px 5% 100px 5%;
            text-align: center;
            background: radial-gradient(circle at center, rgba(0, 240, 255, 0.08) 0%, transparent 65%);
            border-bottom: 1px solid rgba(255,255,255,0.03);
            position: relative;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .hero h1 span {
            color: var(--accent-pink);
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
        }

        .hero p {
            font-size: 1.4rem;
            color: var(--text-muted);
            max-width: 750px;
            margin: 0 auto 35px auto;
            font-weight: 500;
        }

        .hero-badges {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge i { color: var(--accent-cyan); }

        /* Section Layouts */
        .section-title {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            margin: 80px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .section-title span {
            color: var(--accent-cyan);
            text-shadow: var(--neon-glow);
        }

        /* --- STUFF UPGRADE 1: INTERACTIVE BUILDER WIDGET --- */
        .interactive-builder {
            max-width: 950px;
            margin: 0 auto 60px auto;
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .widget-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .widget-layout { grid-template-columns: 1fr; }
        }

        .widget-controls h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }

        .selector-options {
            display: flex;
            gap: 10px;
        }

        .selector-btn {
            flex: 1;
            background: #1b202a;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            transition: 0.2s ease;
            text-transform: uppercase;
        }

        .selector-btn.active {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: inset 0 0 10px rgba(0,240,255,0.2);
        }

        .widget-preview {
            background: #090a0d;
            border-radius: 8px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px dashed rgba(255,255,255,0.05);
        }

        .pc-case-mockup {
            width: 140px;
            height: 180px;
            margin: 0 auto 20px auto;
            border: 4px solid #fff;
            border-radius: 8px;
            position: relative;
            transition: 0.5s ease;
            box-shadow: 0 0 25px rgba(255,255,255,0.1);
        }

        .pc-case-mockup::before {
            content: 'RGB';
            position: absolute;
            top: 45%; left: 30%;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .perf-bar-wrapper {
            margin-top: 10px;
        }
        .perf-label {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .perf-track {
            background: #222;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }
        .perf-fill {
            height: 100%;
            background: var(--accent-cyan);
            width: 45%;
            transition: 0.4s ease;
        }

        .widget-action-btn {
            background: var(--accent-pink);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .widget-action-btn:hover {
            background: #e0006c;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        /* --- STUFF UPGRADE 2: PRE-BUILT GAMING PC GRID --- */
        .builds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 0 5% 60px 5%;
        }

        .build-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: 0.3s ease;
        }

        .build-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-pink);
            box-shadow: 0 8px 30px rgba(255, 0, 127, 0.15);
        }

            position: absolute;
